[package]
name = "amber"
version = "0.1.0"
edition = "2021"
description = "Amber, a desktop resin slicer aimed at the Anycubic Photon M3 Max"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1"
eframe = { version = "0.36", default-features = false, features = ["glow", "persistence", "default_fonts", "x11"] }
egui_glow = "0.36"
glam = { version = "0.30", features = ["serde"] }
glow = "0.17"
png = "0.18"
rayon = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
